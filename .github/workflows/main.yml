name: Deploy EduCorexa
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: appleboy/ssh-action@v1.0.3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }} # আপনার ডোমেইন educorexa.com
          username: ${{ secrets.USERNAME }} # আপনার সিপ্যানেল ইউজার educorex
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd public_html
            git pull origin main
            sh deploy.sh